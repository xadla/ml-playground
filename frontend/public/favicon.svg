<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  width="64"
  height="64"
  fill="none"
>
  <!-- Background -->
  <rect
    x="2"
    y="2"
    width="60"
    height="60"
    rx="14"
    fill="#4F46E5"
  />

  <!-- Monitor -->
  <rect
    x="18"
    y="18"
    width="28"
    height="20"
    rx="3"
    stroke="white"
    stroke-width="2.5"
  />

  <!-- Bottom bezel -->
  <line
    x1="18"
    y1="33"
    x2="46"
    y2="33"
    stroke="white"
    stroke-width="2.5"
  />

  <!-- Power LED -->
  <circle
    cx="32"
    cy="35.8"
    r="1.2"
    fill="white"
  />

  <!-- Stand -->
  <path
    d="M28 38 L26 44 H38 L36 38"
    stroke="white"
    stroke-width="2.5"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Base -->
  <line
    x1="24"
    y1="46"
    x2="40"
    y2="46"
    stroke="white"
    stroke-width="2.5"
    stroke-linecap="round"
  />
</svg>
