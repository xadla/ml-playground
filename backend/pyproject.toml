[project]
name = "ml-playground-backend"
version = "0.1.0"
description = "ML Playground REST API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "redis>=5.2.0",
    "celery[redis]>=5.4.0",
    "passlib[bcrypt]>=1.7.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.28.0",
    "aiofiles>=24.1.0",
    "slowapi>=0.1.6",
    "email-validator>=2.1.0",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pillow>=10.0",
    "schemathesis>=4.4.0",
    "structlog>=22.1.0",
    "psycopg2-binary>=2.9.0",
    "prometheus-fastapi-instrumentator>=7.0",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.0",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "polyfactory==2.18.0",
    "fakeredis==2.26.0",
    "types-redis==4.6.0",
    "types-python-jose==3.3.0",
    "types-passlib==1.7.7",

    "ruff>=0.10",
    "mypy>=1.15",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = ["E501"]  # line too long handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "matplotlib.*",
    "numpy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[dependency-groups]
dev = [
    "pytest==8.3.0",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "polyfactory==2.18.0",
    "fakeredis==2.26.0",
    "types-redis==4.6.0",
    "types-python-jose==3.3.0",
    "types-passlib>=1.7.7"
]
