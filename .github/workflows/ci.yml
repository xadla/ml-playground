name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
  REDIS_URL: redis://localhost:6379/0
  CELERY_BROKER_URL: redis://localhost:6379/0
  CELERY_RESULT_BACKEND: redis://localhost:6379/0

jobs:

  ##############################################
  # Lint
  ##############################################

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - run: ruff check .

      - run: ruff format --check .



  ##############################################
  # Type Checking
  ##############################################

  mypy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - run: mypy app



  ##############################################
  # Tests
  ##############################################

  tests:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:

      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Alembic migrations
        run: |
          alembic upgrade head

      - name: Start Celery Worker
        run: |
          celery -A app.celery_app worker --loglevel=INFO &
          sleep 5

      - name: Run Tests
        run: |
          pytest \
            tests/unit \
            tests/integration \
            -v \
            --cov=app \
            --cov-report=xml \
            --cov-fail-under=90

      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'

        with:
          name: coverage-report
          path: coverage.xml



  ##############################################
  # Contract Testing
  ##############################################

  contract:

    needs: tests

    runs-on: ubuntu-latest

    services:

      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db

        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine

        ports:
          - 6379:6379

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - run: alembic upgrade head

      - name: Start API
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          until curl http://localhost:8000/health
          do
            sleep 1
          done

      - name: Run Schemathesis
        run: |
          schemathesis run \
          http://localhost:8000/api/v1/openapi.json \
          --base-url=http://localhost:8000 \
          --workers=auto \
          --hypothesis-max-examples=50



  ##############################################
  # Docker Build
  ##############################################

  docker:

    needs:
      - lint
      - mypy
      - tests

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ml-playground .
